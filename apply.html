<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Job Application | CareerConnect</title><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">CC</span> CareerConnect</a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav-links"><a href="index.html">Home</a><a href="jobs.html">Find Jobs</a><a href="employer.html">For Employers</a><a href="login.html">Login</a><a class="btn btn-small" href="register.html">Sign Up</a></nav></header>
<main class="page-wrap narrow"><div class="page-title"><span class="eyebrow">TAKE THE NEXT STEP</span><h1>Job application</h1><p>Complete the form below to submit your application.</p></div>
<section class="form-card"><form id="apply-form" class="form-grid" novalidate>
<div class="field full"><label for="apply-job">Position applying for</label><input id="apply-job" name="job" required></div>
<div class="field"><label for="applicant-name">Full name</label><input id="applicant-name" name="name" minlength="3" maxlength="60" required></div>
<div class="field"><label for="applicant-email">Email</label><input id="applicant-email" name="email" type="email" required></div>
<div class="field"><label for="applicant-phone">Phone number</label><input id="applicant-phone" name="phone" type="tel" pattern="[0-9+() -]{7,20}" placeholder="+92 300 1234567" required></div>
<div class="field"><label for="experience">Experience</label><select id="experience" name="experience" required><option value="">Select experience</option><option>Fresh / Entry level</option><option>1–2 years</option><option>3–5 years</option><option>5+ years</option></select></div>
<div class="field full"><label for="resume">Upload resume (PDF/DOC, max 5 MB)</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required><small class="hint">Your selected file is checked in this browser demo; it is not uploaded to a server.</small></div>
<div class="field full"><label for="cover-letter">Cover letter</label><textarea id="cover-letter" name="cover" rows="5" minlength="20" maxlength="1200" placeholder="Tell the employer why you are a good fit (at least 20 characters)." required></textarea></div>
<div class="field full"><button class="btn btn-block" type="submit">Submit application →</button><p id="apply-message" class="form-message" role="status"></p></div>
</form></section></main><footer class="footer"><small>© <span data-year></span> CareerConnect. Lab 3 project demo.</small></footer></body></html>
