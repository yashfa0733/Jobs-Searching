<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | CareerConnect</title><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head>
<body class="auth-body"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">CC</span> CareerConnect</a><a class="text-link" href="jobs.html">Browse jobs →</a></header>
<main class="login-wrap"><section class="form-card login-card"><span class="eyebrow">WELCOME BACK</span><h1>Log in to CareerConnect</h1><p class="muted">Continue your career journey.</p>
<form id="login-form" class="form-grid" novalidate><div class="field full"><label for="login-email">Email address</label><input id="login-email" type="email" placeholder="you@example.com" required></div><div class="field full"><label for="login-password">Password</label><input id="login-password" type="password" minlength="8" placeholder="Your password" required></div><div class="field full"><button class="btn btn-block" type="submit">Log in →</button><p id="login-message" class="form-message" role="status"></p></div></form>
<p class="form-foot">New to CareerConnect? <a href="register.html">Create an account</a></p><p class="demo-hint">Demo: register first on this browser, then use the same email and password.</p></section></main></body></html>
